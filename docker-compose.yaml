services:
  codex_headless:
    build:
      context: .
      dockerfile: contrib/headless-computer-use/Dockerfile
    shm_size: 2gb
    environment:
      NO_VNC_PORT: "6080"
      VNC_PORT: "5901"
      VNC_RESOLUTION: "1440x900"
      BROWSERLESS_ENDPOINT: "${BROWSERLESS_ENDPOINT:-}"
      BROWSERLESS_PUBLIC_ENDPOINT: "${BROWSERLESS_PUBLIC_ENDPOINT:-}"
      BROWSERLESS_SESSION_TTL_SECONDS: "${BROWSERLESS_SESSION_TTL_SECONDS:-1800}"
      BROWSERLESS_TOKEN: "${BROWSERLESS_TOKEN:-}"
    ports:
      - "6080:6080"
      - "5901:5901"
    networks:
      - default
      - browserless
    volumes:
      - codex_headless_data:/data
    restart: unless-stopped

volumes:
  codex_headless_data:

networks:
  browserless:
    external: true
    name: "${BROWSERLESS_NETWORK:-mmehoyam5h8abhc2h9czbk0j}"
